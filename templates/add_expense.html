
{% extends "base.html" %}
{% block title %}Add Expense | SpendWise{% endblock %}

{% block content %}

<div class="container py-4">

    <!-- Page heading -->
    <div class="text-center mb-4">
        <h1 class="fw-bold">Add Expense</h1>
        <p class="text-muted">Track your spending and categorise your expenses.</p>
    </div>

    <!-- Expense form card -->
    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-body p-4">

            <p class="form-text mb-4">Fields marked with <strong>*</strong> are required.Description is optional.</p>

            <form method="POST">

                <div class="mb-3">
                    <label for="amount" class="form-label">Amount (₦) *</label>

                    <div class="input-group">
                        <span class="input-group-text">₦</span>
                        <input type="text" class="form-control" id="amount" name="amount" inputmode="decimal" placeholder="e.g. 130,000.00" value="{{ amount_input if amount_input is defined else (amount or '') }}" autocomplete="off" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="category" class="form-label">Category *</label>
                    <select id="category" name="category" class="form-select" required>
                        <option value="">-- Select a category --</option>
                        <option value="Food" {% if category == "Food" %}selected{% endif %}>Food</option>
                        <option value="Transportation" {% if category == "Transportation" %}selected{% endif %}>Transportation</option>
                        <option value="Housing" {% if category == "Housing" %}selected{% endif %}>Housing</option>
                        <option value="Education" {% if category == "Education" %}selected{% endif %}>Education</option>
                        <option value="Health" {% if category == "Health" %}selected{% endif %}>Health</option>
                        <option value="Shopping" {% if category == "Shopping" %}selected{% endif %}>Shopping</option>
                        <option value="Entertainment" {% if category == "Entertainment" %}selected{% endif %}>Entertainment</option>
                        <option value="Utilities" {% if category == "Utilities" %}selected{% endif %}>Utilities</option>
                        <option value="Personal Care" {% if category == "Personal Care" %}selected{% endif %}>Personal Care</option>
                        <option value="Other" {% if category == "Other" %}selected{% endif %}>Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="type" class="form-label">Expense Type *</label>
                    <select id="type" name="type" class="form-select" required>
                        <option value="">-- Select a type --</option>
                        <option value="Need" {% if type == "Need" %}selected{% endif %}>Need</option>
                        <option value="Want" {% if type == "Want" %}selected{% endif %}>Want</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description (Optional)</label>
                    <textarea id="description" name="description" class="form-control" rows="3" placeholder="Add a note about this expense">{{ description or '' }}</textarea>
                </div>

                <div class="mb-3">
                    <label for="date" class="form-label">Date *</label>
                    <input type="date" id="date" name="date" class="form-control" value="{{ date or '' }}" required>
                </div>

                <div class="d-flex justify-content-center flex-wrap gap-2 mt-4 no-print">
                    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">
                        Go Back
                    </a>

                    <button type="submit" name="action" value="review"class="btn btn-primary">
                        Review Expense
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

<script>
    const amountInput = document.getElementById("amount");

    function formatExpenseAmount(value) {
        value = value.replace(/,/g, "").replace(/[^\d.]/g, "");

        const decimalPosition = value.indexOf(".");

        if (decimalPosition !== -1) {
            value =
                value.substring(0, decimalPosition + 1) +
                value.substring(decimalPosition + 1).replace(/\./g, "");
        }

        const parts = value.split(".");
        parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");

        return parts.join(".");
    }

    amountInput.addEventListener("input", function () {
        this.value = formatExpenseAmount(this.value);
    });

    amountInput.value = formatExpenseAmount(amountInput.value);
</script>

{% endblock %}
