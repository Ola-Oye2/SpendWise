
{% extends "base.html" %}
{% block content %}

<div class="container py-4">
    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-body p-4">

            <h1 class="mb-2">Review Expense</h1>

            <p class="text-muted mb-4">Please check your expense details before confirming.</p>

            <div class="expense-review border rounded p-3 mb-4">

                <div class="row mb-3">
                    <div class="col-5 fw-bold">Amount</div>
                    <div class="col-7">₦{{ "{:,.2f}".format(amount|float) }}</div>
                </div>

                <div class="row mb-3">
                    <div class="col-5 fw-bold">Category</div>
                    <div class="col-7">{{ category }}</div>
                </div>

                <div class="row mb-3">
                    <div class="col-5 fw-bold">Expense Type</div>
                    <div class="col-7">{{ type }}</div>
                </div>

                <div class="row mb-3">
                    <div class="col-5 fw-bold">Description</div>
                    <div class="col-7">{{ description or "No description provided" }}</div>
                </div>

                <div class="row">
                    <div class="col-5 fw-bold">Date</div>
                    <div class="col-7">{{ date }}</div>
                </div>

            </div>

            <div class="d-flex flex-wrap gap-2 no-print">

                <form method="POST" action="{{ url_for('add_expense') }}">
                    <input type="hidden" name="action" value="back">
                    <input type="hidden" name="amount" value="{{ amount_input }}">
                    <input type="hidden" name="category" value="{{ category }}">
                    <input type="hidden" name="type" value="{{ type }}">
                    <input type="hidden" name="description" value="{{ description }}">
                    <input type="hidden" name="date" value="{{ date }}">

                    <button type="submit" class="btn btn-outline-secondary">
                        Back to Edit
                    </button>
                </form>

                <form method="POST" action="{{ url_for('confirm_expense') }}">
                    <input type="hidden" name="amount" value="{{ amount_input }}">
                    <input type="hidden" name="category" value="{{ category }}">
                    <input type="hidden" name="type" value="{{ type }}">
                    <input type="hidden" name="description" value="{{ description }}">
                    <input type="hidden" name="date" value="{{ date }}">

                    <button type="submit" class="btn btn-primary">
                        Confirm Expense
                    </button>
                </form>

            </div>

        </div>
    </div>
</div>

{% endblock %}
