{% extends "base.html" %}
{% block title %}Edit Budget | SpendWise{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="text-center mb-4">
        <h1 class="fw-bold">Edit Budget</h1>
        <p class="text-muted">Update your monthly spending plan.</p>
    </div>

    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-body p-4">

            <form method="POST">

                <div class="mb-3">
                    <label for="month" class="form-label">Month</label>
                    <input type="month" class="form-control" id="month" name="month" value="{{ budget.month.strftime('%Y-%m') if budget.month.strftime is defined else budget.month }}" required>
                </div>

                <div class="mb-3">
                    <label for="total_amount" class="form-label">Total Budget (₦)</label>
                    <div class="input-group">
                        <span class="input-group-text">₦</span>
                        <input type="text" inputmode="decimal" class="form-control money-input" id="total_amount" name="total_amount" value="{{ '{:,.2f}'.format(budget.total_amount|float) }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="needs_limit" class="form-label">Needs Limit (₦)</label>
                    <div class="input-group">
                        <span class="input-group-text">₦</span>
                        <input type="text" inputmode="decimal" class="form-control money-input" id="needs_limit" name="needs_limit" value="{{ '{:,.2f}'.format(budget.needs_limit|float) }}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="wants_limit" class="form-label">Wants Limit (₦)</label>
                    <div class="input-group">
                        <span class="input-group-text">₦</span>
                        <input type="text" inputmode="decimal" class="form-control money-input" id="wants_limit" name="wants_limit" value="{{ '{:,.2f}'.format(budget.wants_limit|float) }}" required>
                    </div>
                </div>

                <div class="d-flex justify-content-center flex-wrap gap-2 mt-4">
                    <a href="{{ url_for('view_budget', budget_id=budget.budget_id) }}" class="btn btn-secondary">
                        Go Back
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Update Budget
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
