{% extends "base.html" %}
{% block title %}Edit Income | SpendWise{% endblock %}

{% block content %}

<div class="container py-4">

    <div class="text-center mb-4">
        <h1 class="fw-bold">Edit Income</h1>
        <p class="text-muted">Update the details of your income record.</p>
    </div>

    <div class="card shadow-sm mx-auto" style="max-width: 650px;">
        <div class="card-body p-4">

            <form method="POST">

                <div class="mb-3">
                    <label for="amount" class="form-label">Amount</label>

                    <div class="input-group">
                        <span class="input-group-text">₦</span>
                        <input type="text" class="form-control money-input" id="amount" name="amount" inputmode="decimal" autocomplete="off" value="{{ '{:,.2f}'.format(income.amount|float) }}" required>
                    </div>

                    <div class="form-text">
                        Enter the amount in naira.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="source" class="form-label">Source</label>
                    <input type="text" class="form-control" id="source" name="source" value="{{ income.source }}" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3">{{ income.description or '' }}</textarea>
                </div>

                <div class="mb-3">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" class="form-control" id="date" name="date" value="{{ income.date.strftime('%Y-%m-%d') }}" required>
                </div>

                <div class="d-flex justify-content-center flex-wrap gap-2 mt-4">
                    <a href="{{ url_for('view_income') }}" class="btn btn-secondary">
                        Go Back
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Save Changes
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
