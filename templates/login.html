
{% extends "base.html" %}
{% block title %}Login | SpendWise{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4">
    <div class="col-12 col-sm-10 col-md-7 col-lg-5">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <h1 class="h3 mb-2">Welcome Back</h1>
                    <p class="text-muted mb-0">Log in to manage your personal finances.</p>
                </div>

                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Login
                    </button>
                </form>

                <hr class="my-4">

                <p class="text-center mb-0">Don't have an account?
                    <a href="{{ url_for('register') }}">Create one</a>
                </p>

            </div>
        </div>
    </div>
</div>
{% endblock %}
