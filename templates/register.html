
{% extends "base.html" %}
{% block title %}Register | Personal Finance Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-12 col-md-10 col-lg-8 col-xl-7">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <h1 class="h3 mb-2">Create Your Account</h1>
                    <p class="text-muted mb-0">Start tracking your income, expenses, and budget.</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">

                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="first_name" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" autocomplete="given-name" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="middle_name" class="form-label">Middle Name<span class="text-muted">(Optional)</span></label>
                            <input type="text" class="form-control" id="middle_name" name="middle_name" autocomplete="additional-name">
                        </div>

                        <div class="col-12">
                            <label for="last_name" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" autocomplete="family-name" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="phone_number" class="form-label">Phone Number</label>
                            <input type="tel" class="form-control" id="phone_number" name="phone_number" autocomplete="tel" required>
                        </div>

                        <div class="col-12">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" autocomplete="new-password" required>
                            <div class="form-text">
                                Use a strong, unique password.
                            </div>
                        </div>

                        <div class="col-12">
                            <label for="main_income_source" class="form-label">Main Income Source</label>
                            <input type="text" class="form-control" id="main_income_source" name="main_income_source" placeholder="e.g. Salary, Business, Allowance" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mt-4">
                        Create Account
                    </button>
                </form>

                <hr class="my-4">

                <p class="text-center mb-0">
                    Already have an account?
                    <a href="{{ url_for('login') }}">Log in</a>
                </p>

            </div>
        </div>
    </div>
</div>
{% endblock %}
